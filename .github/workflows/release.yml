name: Release

# Publishes the @mythicalos/* packages to npm WITH provenance attestation, via
# OIDC Trusted Publishing — no stored NPM_TOKEN. Configure the trusted publisher
# for each package on npmjs.com (Settings -> package -> Trusted Publisher):
#   repository = mythicalOS/mythical-ui, workflow = release.yml
#
# Why npm and not `bun publish`: provenance is an npm feature; bun cannot emit it.
# npm cannot resolve the `workspace:` protocol, so scripts/resolve-workspace-deps.ts
# rewrites those to concrete versions first (what `bun publish` did automatically).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write            # required for OIDC trusted publishing + provenance

env:
  BUN_VERSION: "1.3.14"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mythical-ui
    steps:
      - name: Checkout mythical-ui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mythical-ui
          # Full history + refs: the tag gate below needs origin/main to test reachability.
          fetch-depth: 0

      # A tag push is the ONLY publish trigger and an npm publish is IRREVERSIBLE, so the
      # tag is validated before anything can reach the registry:
      #   1. plain `vX.Y.Z` only — an RC, a build suffix or a typo (`v0.2.0-rc1`, `v1`,
      #      `0.1.15`) must never ship the stable versions sitting in the manifests;
      #   2. reachable from origin/main — a tag pushed on a side branch must not publish.
      #
      # NOTE on what is deliberately NOT asserted: this repo tags a REPO COUNTER, not a
      # package version. The root manifest is private at 0.0.0 and the four packages carry
      # independent versions, so there is no `tag == "v" + version` identity to check — such
      # an assertion would be meaningless here. The tag governs WHETHER a publish runs; the
      # idempotent `publish_if_new` below governs WHICH versions go.
      - name: Validate the release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::refusing to publish from tag '${tag}' — expected a plain vX.Y.Z release tag (no pre-release or build suffix)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag '${tag}' (${GITHUB_SHA}) is not reachable from origin/main — refusing to publish from a side branch."
            exit 1
          fi
          echo "release tag ${tag} validated: plain semver, reachable from main."

      # bun test (below) includes packages/ui-core/test/css.test.ts +
      # packages/shell/css.test.tsx, which read the canonical tokens.css from a
      # SIBLING mythical-design checkout — same reason/layout as ci.yml.
      - name: Checkout mythical-design (sibling — canonical tokens.css)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mythicalOS/mythical-design
          path: mythical-design

      - name: Set up bun (install, build, test)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node + npm (publish)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing / provenance needs npm >= 11.5.1; ubuntu-latest ships 10.x.
      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build FIRST: cross-package imports like `@mythicalos/ui-core/logic`
      # resolve to built dist/, so typecheck of the dependent packages needs the
      # dependency's dist present. `bun run --filter '*' build` builds in
      # dependency order (ui-core before preact-ui/react-ui before shell).
      - name: Build (all packages, dependency order)
        run: bun run build

      - name: Typecheck (all packages)
        run: bun run typecheck

      - name: Unit tests (460)
        run: bun test

      # npm cannot resolve `workspace:` — rewrite to concrete versions first.
      - name: Resolve workspace deps to concrete versions
        run: bun run scripts/resolve-workspace-deps.ts

      # Publish order matters for CONSUMER installability: @mythicalos/ui-core must
      # be live before preact-ui / react-ui (which depend on it), which must be live
      # before shell (which depends on preact-ui). Each publish carries provenance
      # (--provenance) under OIDC trusted publishing — no token is read anywhere.
      # Idempotent: skip a package whose exact version is already on the registry, so
      # a re-tag / re-run does not fail siblings.
      # Last chance to see what this tag actually ships, in the log, BEFORE the irreversible
      # step. The publish loop below makes the same skip/publish decision; this only surfaces
      # it first, so a wrong-looking release is visible rather than inferred afterwards.
      - name: Pre-flight — what this tag will publish
        run: |
          set -euo pipefail
          for dir in packages/ui-core packages/preact-ui packages/react-ui packages/shell; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "  SKIP     ${name}@${version}  (already on the registry)"
            else
              echo "  PUBLISH  ${name}@${version}"
            fi
          done

      - name: Publish packages with provenance (dependency order)
        run: |
          set -euo pipefail
          publish_if_new() {
            local dir="$1" name version
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "already published: ${name}@${version} — skipping"
              return 0
            fi
            echo "publishing ${name}@${version} from ${dir} (with provenance)"
            (cd "${dir}" && npm publish --provenance --access public)
          }
          publish_if_new packages/ui-core
          publish_if_new packages/preact-ui
          publish_if_new packages/react-ui
          publish_if_new packages/shell
